name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      # Lay both repos out as siblings under $GITHUB_WORKSPACE so the
      # default ANUBIS_DIR=../anubis in our Makefile works unchanged.
      - name: Checkout caddy-anubis
        uses: actions/checkout@v6
        with:
          path: caddy-anubis

      - name: Checkout TecharoHQ/anubis
        uses: actions/checkout@v6
        with:
          repository: TecharoHQ/anubis
          path: anubis

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: caddy-anubis/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: anubis/package-lock.json

      # `make setup` is a no-op for the clone step (anubis is already
      # checked out), then runs the asset build and writes go.work.
      # libanubis embeds generated JS/CSS that aren't in its published
      # tarballs (TecharoHQ/anubis#1587), so the asset build is required
      # before any `go build`/`go test`.
      - name: Setup (build libanubis assets, write go.work)
        run: make setup

      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then
            echo "::error::Files need 'gofmt -s -w':"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go test -race
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
