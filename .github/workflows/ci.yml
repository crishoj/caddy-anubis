name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      # Lay both repos out as siblings under $GITHUB_WORKSPACE so the
      # default ANUBIS_DIR=../anubis in our Makefile works unchanged.
      - name: Checkout caddy-anubis
        uses: actions/checkout@v4
        with:
          path: caddy-anubis

      - name: Checkout TecharoHQ/anubis
        uses: actions/checkout@v4
        with:
          repository: TecharoHQ/anubis
          path: anubis

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: anubis/package-lock.json

      # `make setup` is a no-op for the clone step (anubis is already
      # checked out), then runs the asset build and writes go.work.
      # libanubis embeds generated JS/CSS that aren't in its published
      # tarballs (TecharoHQ/anubis#1587), so the asset build is required
      # before any `go build`/`go test`.
      - name: Setup (build libanubis assets, write go.work)
        run: make setup

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...
