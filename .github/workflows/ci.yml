name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then
            echo "::error::Files need 'gofmt -s -w':"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      - name: go test -race
        run: go test -race ./...

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      # Vulns in transitive code we can't fix from here (e.g. things
      # reachable through caddy/v2/modules/standard's acme_server) are
      # listed in .github/govulncheck-allowlist.txt. Anything NOT on
      # that list fails the build, so a new vuln forces an explicit
      # fix-or-allowlist decision.
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest

          # govulncheck exits non-zero when vulns are reachable, so we
          # capture its JSON output and inspect it ourselves.
          govulncheck -format json ./... > vuln.json || true

          # Extract unique vuln IDs from the NDJSON stream.
          found=$(jq -r 'select(.osv) | .osv.id' vuln.json | sort -u)

          if [ -z "$found" ]; then
            echo "No vulnerabilities found."
            exit 0
          fi

          echo "Found vulnerabilities:"
          echo "$found"
          echo

          # Strip comments + blank lines from the allowlist before diff.
          allowlist=$(mktemp)
          grep -vE '^\s*(#|$)' .github/govulncheck-allowlist.txt > "$allowlist"

          unknown=$(echo "$found" | grep -vxFf "$allowlist") || true
          if [ -n "$unknown" ]; then
            echo "::error::Vulnerabilities not in .github/govulncheck-allowlist.txt:"
            echo "$unknown"
            echo
            echo "Either upgrade the affected dependency, or — if it's"
            echo "transitive code we don't actually call — add the ID"
            echo "to the allowlist with a rationale in the commit msg."
            exit 1
          fi

          echo "All vulnerabilities matched allowlist; passing."
