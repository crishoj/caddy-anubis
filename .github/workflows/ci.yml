name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then
            echo "::error::Files need 'gofmt -s -w':"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      - name: go test -race
        run: go test -race ./...

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      # Vulns in transitive code we can't fix from here (e.g. things
      # reachable through caddy/v2/modules/standard's acme_server) are
      # listed in .github/govulncheck-allowlist.txt. Anything NOT on
      # that list fails the build, so a new vuln forces an explicit
      # fix-or-allowlist decision.
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest

          # govulncheck exits non-zero when reachable vulns are found.
          out=$(govulncheck ./... 2>&1) || true

          # Extract unique IDs from "Vulnerability #N: GO-..." headers.
          # govulncheck emits those only for reachable findings; pure
          # database hits (a vuln exists in a dep we don't call into)
          # don't get a header.
          found=$(printf '%s\n' "$out" | sed -nE 's/^Vulnerability #[0-9]+: (GO-[0-9]+-[0-9]+).*/\1/p' | sort -u)

          if [ -z "$found" ]; then
            echo "No reachable vulnerabilities found."
            exit 0
          fi

          echo "govulncheck output:"
          printf '%s\n' "$out"
          echo

          # Strip comments + blank lines from the allowlist before diff.
          allowlist=$(mktemp)
          grep -vE '^\s*(#|$)' .github/govulncheck-allowlist.txt > "$allowlist"

          unknown=$(printf '%s\n' "$found" | grep -vxFf "$allowlist") || true
          if [ -n "$unknown" ]; then
            echo "::error::Reachable vulnerabilities not in .github/govulncheck-allowlist.txt:"
            printf '%s\n' "$unknown"
            echo
            echo "Either upgrade the affected dependency, or — if it's"
            echo "transitive code we don't actually call — add the ID"
            echo "to the allowlist with a rationale in the commit msg."
            exit 1
          fi

          echo "All reachable vulnerabilities matched allowlist; passing."
