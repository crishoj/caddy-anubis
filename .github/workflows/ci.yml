name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then
            echo "::error::Files need 'gofmt -s -w':"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      - name: go test -race
        run: go test -race ./...

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      # Non-blocking: govulncheck flags vulns reachable in our dep tree
      # via symbol analysis, including transitive ones we don't directly
      # call (e.g. smallstep/certificates SCEP issues reachable through
      # caddy/v2/modules/standard's acme_server). Those will be fixed
      # only when Caddy bumps its own deps. The check is still useful
      # for surfacing anything we'd actually invoke, so we run it but
      # don't fail the build.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
