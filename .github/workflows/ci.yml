name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then
            echo "::error::Files need 'gofmt -s -w':"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy-anubis
    steps:
      - uses: actions/checkout@v6
        with:
          path: caddy-anubis
      - uses: ./caddy-anubis/.github/actions/setup

      - name: go test -race
        run: go test -race ./...
